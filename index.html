<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Frontend Code Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="main-heading">Code Editor</h1>
    <div class="code-editor">
        <div class="code">
            <div class="html-code">
                <h1>HTML</h1>
                <textarea></textarea>
            </div>
            <div class="css-code">
                <h1>CSS</h1>
                <textarea></textarea>
            </div>
            <div class="js-code">
                <h1>JS</h1>
                <textarea spellcheck="false"></textarea>
            </div>
        </div>
        <iframe id="result"></iframe>
    </div>
    <script src="script.js"></script>
</body>

</html>
